<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" role="img" aria-labelledby="title desc"><title id="title">The Five-Participant Governance Model</title><desc id="desc">Four independent human authorisers and one non-authorising AI advisory participant, all guided by the Clara Accord.</desc><rect width="680" height="540" rx="22" fill="#f8fafc"/><g font-family="Arial,sans-serif" fill="#183449" text-anchor="middle"><text x="340" y="29" font-size="20" font-weight="bold">The Five-Participant Governance Model</text><path d="M340 74 L340 270" fill="none" stroke="#64748b" stroke-width="3" /><path d="M553 230 L340 270" fill="none" stroke="#64748b" stroke-width="3" /><path d="M474 440 L340 270" fill="none" stroke="#64748b" stroke-width="3" /><path d="M206 440 L340 270" fill="none" stroke="#64748b" stroke-width="3" /><path d="M127 230 L340 270" fill="none" stroke="#0d9488" stroke-width="3" stroke-dasharray="8 6"/><circle cx="340" cy="270" r="86" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="340" y="248" font-size="21" font-weight="bold">The Clara</text><text x="340" y="274" font-size="21" font-weight="bold">Accord</text><text x="340" y="299" font-size="15">Ethical framework</text><rect x="225" y="39" width="230" height="70" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="340" y="69" font-size="20" font-weight="bold">Human 1</text><text x="340" y="91" font-size="15">Operational authority</text><rect x="438" y="195" width="230" height="70" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="553" y="225" font-size="20" font-weight="bold">Human 2</text><text x="553" y="247" font-size="15">Technical safety</text><rect x="359" y="405" width="230" height="70" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="474" y="435" font-size="20" font-weight="bold">Human 3</text><text x="474" y="457" font-size="15">Ethics and rights</text><rect x="91" y="405" width="230" height="70" rx="14" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/><text x="206" y="435" font-size="20" font-weight="bold">Human 4</text><text x="206" y="457" font-size="15">Independent oversight</text><rect x="12" y="195" width="230" height="70" rx="14" fill="#ccfbf1" stroke="#0d9488" stroke-width="2"/><text x="127" y="225" font-size="20" font-weight="bold">AI participant</text><text x="127" y="247" font-size="15">Reasoning and dissent</text><text x="340" y="505" font-size="17" font-weight="bold">Four human authorisations · One AI advisory participant</text><text x="340" y="525" font-size="13">Proposed model — independent review pending</text></g></svg>